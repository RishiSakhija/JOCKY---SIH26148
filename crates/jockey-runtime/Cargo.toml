[package]
name = "jockey-runtime"
version = "0.1.0"
edition = "2021"
description = "JOCKY Runtime: Controlled execution engine, capability validation, sandboxing"
license = "MIT"
repository = "https://github.com/RishiSakhija/JOKEY---SIH26148"
categories = ["forensics", "security", "runtime"]
keywords = ["forensics", "dfir", "runtime", "execution", "sandbox"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

# Crate-local dependencies
jockey-core = { path = "../jockey-core" }
jockey-language = { path = "../jockey-language" }
jockey-evidence = { path = "../jockey-evidence" }
jockey-collectors = { path = "../jockey-collectors" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }